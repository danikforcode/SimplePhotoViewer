[package]
name = "simple_photo_viewer"
version = "0.0.3-alpha"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Лёгкий просмотрщик фото и PDF: правки, коллаж, склейка PDF, печать (нативный Win32)"

[dependencies.windows]
version = "0.58"
features = [
    "Data_Pdf",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Printing",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Storage_Xps",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.lopdf]
version = "0.46"
default-features = false

[build-dependencies]
embed-resource = "2"

# Профиль «минимальный размер»: именно он даёт ~0.3–1 МБ вместо мегабайт отладочной сборки
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
